<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{min-width:0;margin:0;background:transparent}
    body{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif;color:#e8dcc4}
    button,select{font:inherit}
    [hidden]{display:none!important}
    .dpst{--gold:#d6b574;--gold-bright:#f1d28c;--gold-line:rgba(214,181,116,.32);--cyan:#8ee9ea;--panel:rgba(8,11,11,.84);position:relative;width:min(100%,760px);margin:12px auto;isolation:isolate}
    .dpst-frame{position:relative;overflow:hidden;border:1px solid rgba(214,181,116,.82);border-radius:20px 5px 20px 5px;background:linear-gradient(145deg,#0b0f0f,#050707 58%,#0c0b08);box-shadow:0 20px 58px rgba(0,0,0,.5),inset 0 0 58px rgba(0,0,0,.72)}
    .dpst-frame:before{content:"";position:absolute;z-index:30;inset:8px;border:1px solid rgba(214,181,116,.25);border-radius:14px 3px 14px 3px;pointer-events:none}
    .dpst-art{position:absolute;z-index:0;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,rgba(4,7,7,.98) 0%,rgba(4,7,7,.85) 37%,rgba(4,7,7,.28) 72%,rgba(4,7,7,.62) 100%)}
    .dpst-art img{position:absolute;right:-2%;top:0;width:78%;height:100%;object-fit:cover;object-position:64% center;opacity:.28;filter:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%,#000 92%);mask-image:linear-gradient(90deg,transparent 0,#000 26%,#000 92%)}
    .dpst-head{position:relative;z-index:10;display:grid;grid-template-columns:76px minmax(0,1fr) 38px;gap:16px;align-items:center;padding:26px 28px 20px;border-bottom:1px solid rgba(214,181,116,.22);background:linear-gradient(180deg,rgba(5,8,8,.86),rgba(5,8,8,.56))}
    .dpst-avatar{width:76px;height:76px;object-fit:cover;border:1px solid rgba(214,181,116,.82);border-radius:13px 3px 13px 3px;box-shadow:0 0 0 4px rgba(5,8,8,.62),0 10px 26px rgba(0,0,0,.45)}
    .dpst-kicker{margin-bottom:3px;color:#9d8759;font-size:.67rem;letter-spacing:.2em}
    .dpst-titleline{display:flex;align-items:center;gap:10px;min-width:0}
    .dpst-name{overflow:hidden;color:var(--gold-bright);font-size:1.75rem;font-weight:500;letter-spacing:.12em;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 16px rgba(214,181,116,.14)}
    .dpst-gender{flex:0 0 auto;color:#d6cbb6;font-family:Georgia,serif;font-size:1.4rem;font-weight:400}
    .dpst-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;max-width:470px}
    .dpst-meter-label{display:flex;justify-content:space-between;color:#bda777;font-size:.68rem;letter-spacing:.08em}
    .dpst-meter-label b{color:#d8c49c;font-weight:400}
    .dpst-meter{height:7px;margin-top:5px;overflow:hidden;border:1px solid rgba(214,181,116,.32);background:rgba(0,0,0,.52)}
    .dpst-meter i{display:block;height:100%;background:linear-gradient(90deg,#9e5544,#dda765,#f1cc83);box-shadow:0 0 12px rgba(221,157,86,.46);transition:width .25s ease}
    .dpst-meter.qi i{background:linear-gradient(90deg,#356b79,#66bfc3,#a5eeeb);box-shadow:0 0 12px rgba(103,218,221,.4)}
    .dpst-settings{display:grid;width:38px;height:38px;place-items:center;align-self:start;border:1px solid rgba(214,181,116,.58);border-radius:50%;background:rgba(6,9,9,.86);color:var(--gold);cursor:pointer;position:relative;z-index:50}
    .dpst-settings:hover{border-color:var(--cyan);color:var(--cyan)}
    .dpst-head{cursor:pointer}
    .dpst[data-collapsed="on"] .dpst-tabs,.dpst[data-collapsed="on"] .dpst-content{display:none!important}
    .dpst[data-collapsed="on"] .dpst-head{border-bottom:0}
    .dpst[data-collapsed="on"] .dpst-frame{border-radius:20px 5px 20px 5px}
    .dpst-tabs{position:relative;z-index:12;display:flex;overflow-x:auto;padding:0 22px;border-bottom:1px solid rgba(214,181,116,.2);background:rgba(4,7,7,.7);scrollbar-width:none}
    .dpst-tabs::-webkit-scrollbar{display:none}
    .dpst-tab{flex:1 0 auto;min-width:76px;padding:14px 10px 11px;border:0;border-bottom:2px solid transparent;background:transparent;color:#948875;font-size:.74rem;letter-spacing:.12em;cursor:pointer}
    .dpst-tab.is-active{color:var(--gold-bright);border-bottom-color:var(--gold);text-shadow:0 0 12px rgba(214,181,116,.3)}
    .dpst-content{position:relative;z-index:8;min-height:330px;padding:22px;background:linear-gradient(120deg,rgba(6,9,9,.9),rgba(6,9,9,.63) 58%,rgba(6,9,9,.44))}
    .dpst-panel{display:none}.dpst-panel.is-active{display:block}
    .dpst-section-title{display:flex;align-items:center;gap:12px;margin:0 0 13px;color:#e6c782;font-size:.94rem;font-weight:500;letter-spacing:.18em}
    .dpst-section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(214,181,116,.58),transparent)}
    .dpst-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .dpst-card{position:relative;min-width:0;padding:13px 14px;border:1px solid rgba(214,181,116,.24);background:linear-gradient(140deg,rgba(17,22,21,.86),rgba(5,8,8,.82));box-shadow:inset 0 0 18px rgba(0,0,0,.24)}
    .dpst-card:after{content:"◇";position:absolute;right:9px;top:7px;color:rgba(142,233,234,.4);font-size:.7rem}
    .dpst-card.wide{grid-column:1/-1}
    .dpst-label{color:#a78e5c;font-size:.64rem;letter-spacing:.14em}
    .dpst-value{margin-top:6px;color:#dfd4bf;font-size:.84rem;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .dpst-progress{height:4px;margin-top:8px;background:rgba(0,0,0,.52)}
    .dpst-progress i{display:block;height:100%;background:linear-gradient(90deg,#8d642e,#e3bd70)}
    .dpst-list{display:grid;gap:10px}
    .dpst-record{border:1px solid rgba(214,181,116,.25);background:rgba(8,11,11,.82)}
    .dpst-record summary{padding:14px 16px;color:#e0c17e;cursor:pointer;list-style:none;letter-spacing:.08em}
    .dpst-record summary::-webkit-details-marker{display:none}
    .dpst-record summary:before{content:"◇";margin-right:9px;color:var(--cyan)}
    .dpst-record summary:after{content:"＋";float:right;color:#b99b5d}
    .dpst-record[open] summary:after{content:"－"}
    .dpst-summary-meta{margin-left:10px;color:#8f836f;font-size:.67rem;letter-spacing:.04em}
    .dpst-record-body{padding:0 14px 14px}
    .dpst-subtitle{margin:15px 0 8px;color:#b99b64;font-size:.74rem;letter-spacing:.15em}
    .dpst-empty{padding:30px 18px;border:1px dashed rgba(214,181,116,.28);color:#8e8473;text-align:center;font-size:.8rem;letter-spacing:.12em}
    .dpst-settings-panel{position:absolute;z-index:100;right:24px;top:78px;width:min(320px,calc(100% - 48px));padding:18px;border:1px solid rgba(214,181,116,.72);background:rgba(7,10,10,.98);box-shadow:0 22px 56px rgba(0,0,0,.68)}
    .dpst-settings-panel h3{margin:0 0 13px;color:#e5c681;font-size:.95rem;font-weight:500;letter-spacing:.14em}
    .dpst-close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#bfa46d;font-size:1.2rem;cursor:pointer}
    .dpst-settings-panel label{display:grid;gap:6px;margin:10px 0;color:#aa966b;font-size:.72rem}
    .dpst-settings-panel select{width:100%;padding:8px 10px;border:1px solid rgba(214,181,116,.38);background:#0b0e0e;color:#e8dcc4}
    .dpst-font-row{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center}
    .dpst-settings-panel input[type="range"]{width:100%;margin:0;accent-color:var(--gold);cursor:pointer}
    .dpst-font-row output{color:var(--gold-bright);font-family:Georgia,serif;font-size:.76rem;text-align:right;font-variant-numeric:tabular-nums}
    .dpst[data-bg="off"] .dpst-art{display:none}
    .dpst[data-theme="day"]{color:#2f2a23}
    .dpst[data-theme="day"] .dpst-frame{background:linear-gradient(145deg,#f0eadc,#dcd2be 62%,#efe4cf);box-shadow:0 14px 40px rgba(57,43,22,.22)}
    .dpst[data-theme="day"] .dpst-head,.dpst[data-theme="day"] .dpst-tabs{background:rgba(244,237,223,.76)}
    .dpst[data-theme="day"] .dpst-content{background:linear-gradient(120deg,rgba(241,234,220,.94),rgba(232,222,201,.74))}
    .dpst[data-theme="day"] .dpst-card,.dpst[data-theme="day"] .dpst-record{background:rgba(249,244,234,.8)}
    .dpst[data-theme="day"] .dpst-value{color:#3e372d}.dpst[data-theme="day"] .dpst-gender{color:#4a4338}
    @media(max-width:600px){.dpst-head{grid-template-columns:64px minmax(0,1fr) 34px;padding:20px 18px 16px;gap:12px}.dpst-avatar{width:64px;height:64px}.dpst-name{font-size:1.35rem}.dpst-bars{grid-template-columns:1fr}.dpst-content{padding:16px}.dpst-grid{grid-template-columns:1fr 1fr}.dpst-tabs{padding:0 10px}.dpst-tab{min-width:68px}}
    @media(max-width:420px){.dpst-grid{grid-template-columns:1fr}.dpst-head{grid-template-columns:56px minmax(0,1fr) 32px;padding:17px 14px 14px}.dpst-avatar{width:56px;height:56px}.dpst-name{font-size:1.15rem}.dpst-content{min-height:280px}}
  
    .dpst-hero-layout{display:grid;gap:22px}
    .dpst-realm-gauge{
      --realm-progress:0deg;
      position:relative;
      display:grid;
      width:min(76%,430px);
      aspect-ratio:1;
      margin:8px auto 24px;
      place-items:center;
      border:1px solid rgba(214,181,116,.66);
      border-radius:50%;
      background:
        radial-gradient(circle at center,rgba(8,11,11,.92) 0 40%,transparent 40.5%),
        repeating-conic-gradient(from -1deg,rgba(214,181,116,.62) 0 .28deg,transparent .38deg 5deg),
        radial-gradient(circle,rgba(8,12,13,.72) 0 57%,rgba(4,7,7,.46) 58% 100%);
      box-shadow:
        inset 0 0 0 10px rgba(5,8,8,.76),
        inset 0 0 0 12px rgba(214,181,116,.18),
        inset 0 0 0 28px rgba(5,8,8,.62),
        inset 0 0 42px rgba(0,0,0,.84),
        0 0 32px rgba(0,0,0,.42);
      isolation:isolate;
    }
    .dpst-realm-gauge:before,.dpst-realm-gauge:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .dpst-realm-gauge:before{
      inset:7.5%;
      padding:5px;
      background:conic-gradient(from -90deg,var(--cyan) 0 var(--realm-progress),rgba(214,181,116,.1) var(--realm-progress) 360deg);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      filter:drop-shadow(0 0 7px rgba(142,233,234,.46));
    }
    .dpst-realm-gauge:after{inset:17%;border:1px solid rgba(214,181,116,.46);box-shadow:inset 0 0 0 8px rgba(3,7,7,.44),0 0 0 10px rgba(214,181,116,.08)}
    .dpst-realm-inner{
      position:relative;
      z-index:3;
      display:grid;
      width:57%;
      aspect-ratio:1;
      place-items:center;
      align-content:center;
      border:1px solid rgba(214,181,116,.2);
      border-radius:50%;
      background:radial-gradient(circle,rgba(10,13,13,.94),rgba(4,7,7,.78));
      box-shadow:inset 0 0 36px rgba(0,0,0,.74);
      text-align:center;
    }
    .dpst-realm-major,.dpst-realm-minor{display:block;color:var(--gold-bright);font-weight:500;text-shadow:0 0 16px rgba(214,181,116,.2)}
    .dpst-realm-major{font-size:clamp(1.45rem,5vw,2.15rem);letter-spacing:.2em;text-indent:.2em}
    .dpst-realm-minor{margin-top:2px;font-size:clamp(1.3rem,4.6vw,1.9rem);letter-spacing:.18em;text-indent:.18em}
    .dpst-realm-rule{width:68%;height:1px;margin:12px auto 9px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .dpst-realm-progress-label{color:#ad9669;font-size:.67rem;letter-spacing:.18em;text-indent:.18em}
    .dpst-realm-progress-value{color:var(--gold-bright);font-family:Georgia,serif;font-size:1.65rem;line-height:1.2;font-variant-numeric:tabular-nums}
    .dpst-gauge-axis{position:absolute;z-index:4;background:rgba(214,181,116,.52);pointer-events:none}
    .dpst-gauge-axis.ns{top:-2%;bottom:-2%;left:50%;width:1px;transform:translateX(-50%)}
    .dpst-gauge-axis.ew{left:-2%;right:-2%;top:50%;height:1px;transform:translateY(-50%)}
    .dpst-gauge-node{position:absolute;z-index:6;width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(85,230,241,.62));pointer-events:none}
    .dpst-gauge-node.n{top:-27px;left:calc(50% - 27px)}
    .dpst-gauge-node.e{right:-27px;top:calc(50% - 27px)}
    .dpst-gauge-node.s{bottom:-27px;left:calc(50% - 27px)}
    .dpst-gauge-node.w{left:-27px;top:calc(50% - 27px)}
    .dpst-gauge-star{position:absolute;z-index:5;width:8px;height:8px;border:1px solid var(--gold);background:#0b1010;box-shadow:0 0 6px rgba(214,181,116,.42);transform:rotate(45deg)}
    .dpst-gauge-star.ne{right:14%;top:14%}.dpst-gauge-star.se{right:14%;bottom:14%}.dpst-gauge-star.sw{left:14%;bottom:14%}.dpst-gauge-star.nw{left:14%;top:14%}
    .dpst-summary-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
    .dpst-summary-name{min-width:0;color:#e0c17e;font-size:.9rem;overflow-wrap:anywhere}
    .dpst-summary-gender{margin-left:7px;color:#d6cbb6;font-family:Georgia,serif;font-style:normal;letter-spacing:0}
    .dpst-summary-relation{max-width:150px;color:#b99b64;font-size:.68rem;text-align:right;overflow-wrap:anywhere}
    .dpst-favor{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:10px;color:#a78e5c;font-size:.64rem}
    .dpst-favor-track{height:5px;overflow:hidden;border:1px solid rgba(214,181,116,.24);background:rgba(0,0,0,.52)}
    .dpst-favor-track i{display:block;height:100%;background:linear-gradient(90deg,#8d642e,#e3bd70,#8ee9ea);box-shadow:0 0 8px rgba(142,233,234,.3)}
    .dpst-record summary{position:relative}
    .dpst-avatar-button{position:relative;display:grid;width:76px;height:76px;padding:0;place-items:center;overflow:hidden;border:1px solid rgba(214,181,116,.82);border-radius:13px 3px 13px 3px;background:linear-gradient(145deg,rgba(14,20,20,.92),rgba(4,7,7,.96));box-shadow:0 0 0 4px rgba(5,8,8,.62),0 10px 26px rgba(0,0,0,.45);cursor:pointer}
    .dpst-avatar-button:hover{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(5,8,8,.62),0 0 20px rgba(142,233,234,.18)}
    .dpst-avatar-button .dpst-avatar{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
    .dpst-avatar-empty{display:grid;position:absolute;inset:0;place-items:center;color:rgba(214,181,116,.7);font-size:1.6rem;font-weight:300;background:radial-gradient(circle at center,rgba(142,233,234,.08),transparent 66%)}
    .dpst-avatar-empty:after{content:"头像";position:absolute;bottom:10px;color:#887654;font-size:.55rem;letter-spacing:.2em;text-indent:.2em}
    .dpst-avatar-modal{position:absolute;z-index:180;inset:0;display:grid;place-items:start center;padding:72px 24px 24px;background:rgba(2,5,5,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
    .dpst-avatar-dialog{position:relative;width:min(430px,100%);padding:25px;border:1px solid rgba(214,181,116,.72);border-radius:16px 4px 16px 4px;background:linear-gradient(145deg,rgba(13,17,16,.98),rgba(4,7,7,.99));box-shadow:0 24px 70px rgba(0,0,0,.72),inset 0 0 36px rgba(214,181,116,.035)}
    .dpst-avatar-dialog h3{margin:0 0 18px;color:var(--gold-bright);font-size:1rem;font-weight:500;letter-spacing:.18em}
    .dpst-avatar-dialog label{display:grid;gap:7px;margin:14px 0;color:#aa966b;font-size:.72rem;letter-spacing:.08em}
    .dpst-avatar-url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
    .dpst-avatar-url-row input{min-width:0;padding:10px 11px;border:1px solid rgba(214,181,116,.35);background:rgba(0,0,0,.42);color:#e8dcc4;outline:0}
    .dpst-avatar-url-row input:focus{border-color:var(--cyan)}
    .dpst-avatar-action{padding:10px 14px;border:1px solid rgba(214,181,116,.5);background:rgba(15,19,18,.88);color:#dbc080;cursor:pointer}
    .dpst-avatar-action:hover{border-color:var(--cyan);color:var(--cyan)}
    .dpst-avatar-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}
    .dpst-avatar-status{min-height:1.4em;margin-top:11px;color:#8f836f;font-size:.67rem}
    .dpst-avatar-close{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#bfa46d;font-size:1.25rem;cursor:pointer}
    @media(max-width:600px){.dpst-avatar-button{width:64px;height:64px}.dpst-realm-gauge{width:min(84%,360px)}.dpst-gauge-node{width:44px;height:44px}.dpst-gauge-node.n{top:-22px;left:calc(50% - 22px)}.dpst-gauge-node.e{right:-22px;top:calc(50% - 22px)}.dpst-gauge-node.s{bottom:-22px;left:calc(50% - 22px)}.dpst-gauge-node.w{left:-22px;top:calc(50% - 22px)}}
    @media(max-width:420px){.dpst-avatar-button{width:56px;height:56px}.dpst-avatar-modal{padding:54px 12px 18px}.dpst-avatar-actions{grid-template-columns:1fr}.dpst-realm-gauge{width:min(88%,310px)}.dpst-gauge-node{width:38px;height:38px}.dpst-gauge-node.n{top:-19px;left:calc(50% - 19px)}.dpst-gauge-node.e{right:-19px;top:calc(50% - 19px)}.dpst-gauge-node.s{bottom:-19px;left:calc(50% - 19px)}.dpst-gauge-node.w{left:-19px;top:calc(50% - 19px)}}

  

/* v1.2 移动端适配：状态栏全部页签、设置与头像弹窗 */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.dpst,.dpst-frame,.dpst-head,.dpst-content,.dpst-panel{min-width:0;max-width:100%}
.dpst-value,.dpst-summary-name,.dpst-summary-relation,.dpst-record summary,.dpst-record-body{overflow-wrap:anywhere;word-break:break-word}
@media(max-width:600px){
  body{padding:0 max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left))}
  .dpst{width:100%;margin:6px auto}.dpst-frame{border-radius:14px 4px 14px 4px}.dpst-frame:before{inset:5px;border-radius:10px 3px 10px 3px}
  .dpst-head{grid-template-columns:58px minmax(0,1fr) 40px;gap:10px;padding:16px 13px 13px}.dpst-avatar-button,.dpst-avatar{width:58px;height:58px}.dpst-kicker{font-size:.59rem;letter-spacing:.13em}.dpst-titleline{min-width:0;flex-wrap:wrap;gap:4px 8px}.dpst-name{max-width:100%;font-size:1.22rem;letter-spacing:.08em}.dpst-gender{font-size:1.08rem}.dpst-bars{grid-template-columns:1fr;gap:7px;margin-top:8px}.dpst-meter-label{font-size:.62rem}.dpst-meter{height:6px;margin-top:3px}.dpst-settings{width:40px;height:40px;touch-action:manipulation}
  .dpst-tabs{gap:0;padding:0 7px;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.dpst-tab{flex:0 0 auto;min-width:66px;min-height:44px;padding:12px 9px 9px;scroll-snap-align:start;touch-action:manipulation}
  .dpst-content{min-height:260px;padding:13px}.dpst-section-title{gap:8px;font-size:.86rem;letter-spacing:.12em}.dpst-grid{grid-template-columns:1fr;gap:8px}.dpst-card,.dpst-card.wide{grid-column:auto;padding:11px 12px}.dpst-value{font-size:.82rem;line-height:1.58}
  .dpst-record summary{min-height:44px;padding:12px 11px;line-height:1.5}.dpst-summary-meta{display:block;margin:4px 0 0 21px}.dpst-record-body{padding:0 11px 12px}.dpst-summary-row{grid-template-columns:1fr;gap:5px}.dpst-summary-relation{max-width:none;text-align:left}.dpst-favor{grid-template-columns:auto minmax(0,1fr) auto;gap:6px}
