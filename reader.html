  function readBlock(text,opening,pattern){let depth=1;let nested=false;pattern.lastIndex=opening.end;let match;while((match=pattern.exec(text))){const closing=match[1]==='/';const type=match[2].toLowerCase();if(type===opening.type&&closing&&!match[3].trim()){depth-=1;if(depth===0){const body=text.slice(opening.end,match.index);return{body,end:pattern.lastIndex,nested:nested||/<\/?(?:scene|battle_review)\b/iu.test(body),raw:text.slice(opening.start,pattern.lastIndex)}}}else{nested=true;if(!closing&&type===opening.type)depth+=1}}return null}
  function pushNarration(tokens,value){const text=String(value??'').trim();if(text)tokens.push({type:'narration',paragraphs:paragraphs(text)})}
  function tokenize(value){const text=String(value??'').replace(/\r\n?/gu,'\n');const tokens=[];const pattern=/[{]([^{}\r\n]{1,80})[}]「|<(scene|battle_review)\b([^>]*)>/giu;let cursor=0;let match;while((match=pattern.exec(text))){if(match[1]!==undefined){const start=pattern.lastIndex;const end=text.indexOf('」',start);if(end<0){pushNarration(tokens,text.slice(cursor));cursor=text.length;break}pushNarration(tokens,text.slice(cursor,match.index));const speaker=normalize(match[1]);const lines=paragraphs(text.slice(start,end));const previous=tokens.at(-1);if(previous?.type==='dialogue'&&normalize(previous.speaker)===speaker)previous.paragraphs.push(...lines);else tokens.push({type:'dialogue',speaker,paragraphs:lines});cursor=end+1;pattern.lastIndex=cursor;continue}const type=match[2].toLowerCase();const tagPattern=/<(\/?)((?:scene|battle_review))\b([^>]*)>/giu;const block=readBlock(text,{type,start:match.index,end:pattern.lastIndex},tagPattern);if(!block){pushNarration(tokens,text.slice(cursor));cursor=text.length;break}pushNarration(tokens,text.slice(cursor,match.index));const parsed=type==='scene'?attrs(match[3],schemas.scene):(attrs(match[3],schemas.battle)||legacyBattle(match[3]));if(parsed&&!block.nested)tokens.push({type:type==='scene'?'scene':'battle_review',...parsed,paragraphs:paragraphs(block.body)});else pushNarration(tokens,block.raw);cursor=block.end;pattern.lastIndex=cursor}if(cursor<text.length)pushNarration(tokens,text.slice(cursor));return tokens}
  function renderNarration(token){const fragment=document.createDocumentFragment();for(const value of token.paragraphs)fragment.append(make('p','narration',value));return fragment}
  function renderDialogue(token){const player=Boolean(user)&&normalize(token.speaker)===user;const article=make('article','dialogue'+(player?' is-player':''));article.style.setProperty('--speaker',player?'#61e6e5':speakerColor(token.speaker));const avatar=make('button','avatar');avatar.type='button';avatar.setAttribute('aria-label',`更换${token.speaker}头像`);avatar.title='点击更换头像';setAvatar(avatar,token.speaker,readAvatar(token.speaker));avatar.addEventListener('click',()=>openEditor(article,avatar,token.speaker));const speech=make('div','speech');const name=make('p','name');name.append(document.createTextNode(token.speaker),make('small','',player?'玩家':'角色对白'));const bubble=make('div','bubble');if(DoupoPortraits.list(token.speaker).length){const portrait=make('img','speech-portrait');DoupoPortraits.paint(portrait,token.speaker);bubble.append(portrait)}appendParagraphs(bubble,token.paragraphs);speech.append(name,bubble);article.append(avatar,speech);return article}
  function renderScene(token,index){const section=make('section','scene');section.append(make('p','scene__kicker',`场景转换 · SCENE SHIFT · ${String(index).padStart(2,'0')}`),make('h2','',token.location));const meta=make('div','scene__meta');if(token.time)meta.append(make('span','',`时｜${token.time}`));if(token.mood)meta.append(make('span','',`境｜${token.mood}`));section.append(meta);const body=make('div','scene__body');appendParagraphs(body,token.paragraphs);section.append(body);return section}
  function renderBattle(token){const cls=token.result==='成功'?'battle--success':token.result==='失败'?'battle--failure':token.result==='未执行'?'battle--reject':'battle--pending';const symbol=token.result==='成功'?'成':token.result==='失败'?'败':token.result==='未执行'?'驳':'定';const title=token.result==='成功'?'战斗胜利':token.result==='失败'?'攻势受阻':token.result==='未执行'?'意图驳回':'胜负待定';const section=make('section',`battle ${cls}`);const inner=make('div','battle__inner');const head=make('div','battle__head');const seal=make('div','seal');seal.append(make('span','',symbol));const heading=make('div','');heading.append(make('p','battle__eyebrow',token.ver==='legacy'?'历史战斗记录':'战局判定 · COMBAT RESOLUTION'),make('h2','',title));head.append(seal,heading,make('span','verdict',token.result));const review=make('div','review-strip');review.append(make('b','',`合理性审查：${token.review}`),make('span','',`结算范围：${token.scope}`));const versus=make('div','versus');const left=make('div','fighter');left.append(make('span','',token.actor_realm),make('strong','',token.actor));const right=make('div','fighter');right.append(make('span','',token.target_realm),make('strong','',token.target));versus.append(left,make('span','vs','对阵'),right);const facts=make('div','facts');for(const [label,value] of [['本轮意图',token.action],['境界关系',token.gap],['判定依据',token.basis],['本轮代价',token.cost]]){const fact=make('div','fact');fact.append(make('b','',label),make('span','',value));facts.append(fact)}const text=make('div','battle__text');appendParagraphs(text,token.paragraphs);inner.append(head,review,versus,facts,text);section.append(inner);return section}
  const story=normalize(source.story).replace(/^剧情\s*[-—–:：]\s*/u,'');const match=story.match(/^(.*)·(第\d+章到第\d+章)$/u);root.querySelector('[data-story]').textContent=match?.[1]||story||'未归档篇章';root.querySelector('[data-range]').textContent=match?.[2]||'章节范围未定';root.querySelector('[data-time]').textContent=normalize(source.time).replace(/^时间\s*[:：-]?\s*/u,'')||'炎历未定';
  const flow=root.querySelector('[data-flow]');const fragment=document.createDocumentFragment();let sceneIndex=0;for(const token of tokenize(source.plot)){if(token.type==='dialogue')fragment.append(renderDialogue(token));else if(token.type==='scene'){sceneIndex+=1;fragment.append(renderScene(token,sceneIndex))}else if(token.type==='battle_review')fragment.append(renderBattle(token));else fragment.append(renderNarration(token))}flow.replaceChildren(fragment);
  window.addEventListener('doupo-portrait-change',()=>{root.querySelectorAll('[data-avatar-owner]').forEach(b=>setAvatar(b,b.dataset.avatarOwner,readAvatar(b.dataset.avatarOwner)));});let size=18;try{size=Math.max(15,Math.min(22,Number(localStorage.getItem('doupo-v03-size'))||18))}catch(_error){}const apply=()=>document.documentElement.style.setProperty('--font-size',`${size}px`);apply();root.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const n=Number(button.dataset.size);size=n===0?18:Math.max(15,Math.min(22,size+n));apply();try{localStorage.setItem('doupo-v03-size',String(size))}catch(_error){}}));root.querySelector('[data-motion]')?.addEventListener('click',event=>{const on=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(on));document.body.classList.toggle('motion-off',!on)});
})();
